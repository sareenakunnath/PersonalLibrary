{% extends "base.html" %}

{% block content %}

<h2>Add Book</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Save Book
    </button>

    <a href="{% url 'book_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
